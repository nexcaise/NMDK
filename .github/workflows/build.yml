name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MOD_NAME: nmdk_examples
  NDK_VERSION: r29

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (android-arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    defaults:
      run:
        working-directory: examples

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake
            examples/.xmake
          key: xmake-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('examples/xmake.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-${{ env.NDK_VERSION }}-
            xmake-${{ runner.os }}-

      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Configure
        run: |
          xmake f -y -p android -a arm64-v8a -m release \
            --ndk="${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build
        run: xmake -y -v

      - name: Package .levipack
        id: locate
        run: bash scripts/package_levipack.sh "$MOD_NAME" build

      - name: Show output files
        run: |
          echo "Build number: ${{ github.run_number }}"
          echo "SHA: ${{ github.sha }}"
          ls -lh "${{ steps.locate.outputs.so_file }}"
          ls -lh "${{ steps.locate.outputs.pack_file }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-build-${{ github.run_number }}
          path: |
            examples/${{ steps.locate.outputs.so_file }}
            examples/${{ steps.locate.outputs.pack_file }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.MOD_NAME }} Build ${{ github.run_number }}
          body: |
            Automated build release.

            Build Number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            examples/${{ steps.locate.outputs.so_file }}
            examples/${{ steps.locate.outputs.pack_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
