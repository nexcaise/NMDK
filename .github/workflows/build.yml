name: Package & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package nmdk.levipack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Package nmdk.levipack
        id: nmdk_pack
        run: bash scripts/package_nmdk.sh dist

      - name: Show output files
        run: |
          echo "Build number: ${{ github.run_number }}"
          echo "SHA: ${{ github.sha }}"
          echo "NMDK version: ${{ steps.nmdk_pack.outputs.nmdk_version }}"
          ls -lh "${{ steps.nmdk_pack.outputs.nmdk_pack_file }}"

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: NMDK Build ${{ github.run_number }}
          body: |
            Automated build release.

            NMDK Version: ${{ steps.nmdk_pack.outputs.nmdk_version }}
            Build Number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.nmdk_pack.outputs.nmdk_pack_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
